name: 'Storybook Visual Regression'
description: 'Storybook visual regression posted inline on PRs'
author: 'krystxf'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  build-command:
    description: 'Command that builds Storybook into static-dir (run for both head and base).'
    default: 'npx storybook build'
  static-dir:
    description: 'Directory the build outputs to.'
    default: 'storybook-static'
  themes:
    description: 'Comma-separated Storybook themes to capture (globals theme:<name>).'
    default: 'light,dark'
  min-diff-pixels:
    description: 'Ignore diffs smaller than this many pixels.'
    default: '20'
  pixelmatch-threshold:
    description: 'Per-pixel color sensitivity (0–1).'
    default: '0.1'
  ignore-story-names:
    description: 'Comma-separated, case-insensitive story-name substrings to skip (composite stories).'
    default: 'All Variants'
  attachment-token:
    description: 'User token (PAT or OAuth) with repository push access; Actions GITHUB_TOKEN is unsupported for uploads.'
    required: true
  github-token:
    description: 'Token with pull-requests:write, statuses:write, actions:read.'
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    # ---- pull_request: build head + base, diff ----
    - name: Install screenshot deps
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # postinstall skips; we install just chromium next
      run: |
        cd "${{ github.action_path }}"
        npm ci --omit=dev --no-audit --no-fund
        npx playwright install --with-deps chromium

    - name: Screenshot & diff
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BUILD_COMMAND: ${{ inputs.build-command }}
        STATIC_DIR: ${{ inputs.static-dir }}
        THEMES: ${{ inputs.themes }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        MIN_DIFF_PIXELS: ${{ inputs.min-diff-pixels }}
        PIXELMATCH_THRESHOLD: ${{ inputs.pixelmatch-threshold }}
        VRT_IGNORE_STORY_NAMES: ${{ inputs.ignore-story-names }}
        NODE_OPTIONS: --disable-warning=ExperimentalWarning
      run: |
        set -euo pipefail
        # HEAD (the checked-out ref, typically the PR merge result)
        eval "$BUILD_COMMAND"
        node "$ACTION_PATH/scripts/capture.mts" --static "$STATIC_DIR" --out .vrt/head --themes "$THEMES"
        # BASE: flip the working tree to base, rebuild, restore. Reuses the workspace's
        # node_modules so the consumer's build-command resolves normally (no bin gymnastics).
        ORIG="$(git rev-parse HEAD)"
        git checkout -q --detach "$BASE_SHA"
        eval "$BUILD_COMMAND"
        node "$ACTION_PATH/scripts/capture.mts" --static "$STATIC_DIR" --out .vrt/base --themes "$THEMES"
        git checkout -q --detach "$ORIG"
        node "$ACTION_PATH/scripts/diff.mts" --base .vrt/base --head .vrt/head --out .vrt/out

    - name: Upload screenshot attachments
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.attachment-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: node "${{ github.action_path }}/scripts/publish-attachments.mts"

    - name: Save report for approval checks
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: vrt-report-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
        path: .vrt/out/report.json
        overwrite: true

    - name: Comment & set status
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        NODE_OPTIONS: --disable-warning=ExperimentalWarning
      run: node "${{ github.action_path }}/scripts/evaluate.mts"

    - name: Remove temporary upload comments
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.attachment-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: node "${{ github.action_path }}/scripts/publish-attachments.mts" --cleanup

    # ---- issue_comment: re-evaluate the approval gate (no re-screenshot) ----
    - name: Re-evaluate approvals
      if: github.event_name == 'issue_comment'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.issue.number }}
        NODE_OPTIONS: --disable-warning=ExperimentalWarning
      run: |
        set -euo pipefail
        HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
        ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=vrt-report-${PR_NUMBER}-${HEAD_SHA}&per_page=100" \
          --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
        if [ -n "$ARTIFACT_ID" ]; then
          mkdir -p .vrt/out
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > .vrt/report.zip
          unzip -oq .vrt/report.zip -d .vrt/out
          HEAD_SHA="$HEAD_SHA" node "${{ github.action_path }}/scripts/evaluate.mts"
        else
          echo "No retained report for PR ${PR_NUMBER} at ${HEAD_SHA}; rerun visual regression to evaluate approvals."
        fi
